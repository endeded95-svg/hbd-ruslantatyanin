<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Поздравление для Руслана</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
      --red: #ff2d20;
      --deep-red: #3a0605;
      --bg: #030305;
      --white: #fff;
      --font-main: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif: Georgia, "Times New Roman", serif;
      --font-script: "Snell Roundhand", "Brush Script MT", "Apple Chancery", "Segoe Script", cursive;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--white);
      font-family: var(--font-main);
    }

    body {
      position: fixed;
      inset: 0;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: max(8px, var(--safe-top)) 12px max(8px, var(--safe-bottom));
      background:
        radial-gradient(circle at 50% 14%, rgba(255, 255, 255, .08), transparent 18%),
        radial-gradient(circle at 50% 28%, rgba(255, 45, 32, .28), transparent 34%),
        radial-gradient(circle at 50% 96%, rgba(255, 45, 32, .16), transparent 34%),
        linear-gradient(180deg, #100f12 0%, #07070a 48%, #010102 100%);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 0 48%, rgba(0,0,0,.78) 100%),
        linear-gradient(90deg, rgba(0,0,0,.70), transparent 24%, transparent 76%, rgba(0,0,0,.70));
    }

    .page::after {
      content: "";
      position: absolute;
      inset: -30%;
      z-index: 2;
      opacity: .11;
      pointer-events: none;
      mix-blend-mode: soft-light;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,.045) 0 1px, transparent 1px 4px),
        radial-gradient(circle at 24% 18%, rgba(255,255,255,.08), transparent 18%),
        radial-gradient(circle at 76% 88%, rgba(255,45,32,.10), transparent 22%);
      animation: grain 13s steps(5) infinite;
    }

    .ambient {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -3%;
      width: min(118vw, 720px);
      height: 60svh;
      transform: translateX(-50%);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.12) 0%, rgba(255,45,32,.11) 28%, rgba(255,45,32,.035) 55%, transparent 76%);
      filter: blur(24px);
      opacity: .72;
      animation: beamFlicker 5s linear infinite, beamFloat 12s ease-in-out infinite;
    }

    .ambient::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -24%;
      width: min(720px, 140vw);
      height: min(720px, 140vw);
      transform: translateX(-50%);
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255,45,32,.30), transparent 62%);
      filter: blur(88px);
      opacity: .82;
      animation: glowShift 13s ease-in-out infinite;
    }

    .light-flicker,
    .light-sweep,
    .lens-flare,
    .neon-line,
    .orb,
    .confetti-layer,
    .bubble-layer {
      position: absolute;
      pointer-events: none;
    }

    .light-flicker {
      inset: 0;
      background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,.045), transparent 28%),
        radial-gradient(circle at 50% 60%, rgba(255,45,32,.04), transparent 34%);
      mix-blend-mode: screen;
      animation: softFlicker 4.8s linear infinite;
    }

    .light-sweep {
      top: -12%;
      height: 125%;
      width: 24vw;
      max-width: 210px;
      border-radius: 999px;
      filter: blur(36px);
      mix-blend-mode: screen;
    }

    .light-sweep.one {
      left: -22%;
      background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,.10) 32%, rgba(255,45,32,.13) 56%, rgba(255,255,255,.03) 100%);
      opacity: .35;
      animation: sweepMoveA 14s ease-in-out infinite;
    }

    .light-sweep.two {
      right: -24%;
      background: linear-gradient(180deg, transparent 0%, rgba(255,45,32,.11) 34%, rgba(255,255,255,.07) 58%, transparent 100%);
      opacity: .24;
      animation: sweepMoveB 16s ease-in-out infinite;
    }

    .lens-flare {
      left: 50%;
      top: 14%;
      width: min(76vw, 470px);
      height: 110px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: radial-gradient(ellipse at center, rgba(255,255,255,.13) 0%, rgba(255,45,32,.16) 34%, transparent 74%);
      filter: blur(28px);
      mix-blend-mode: screen;
      opacity: .30;
      animation: flarePulse 8.5s ease-in-out infinite;
    }

    .neon-line {
      left: 50%;
      width: min(78vw, 560px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.42), rgba(255,45,32,.72), rgba(255,255,255,.20), transparent);
      filter: drop-shadow(0 0 8px rgba(255,255,255,.18)) drop-shadow(0 0 18px rgba(255,45,32,.40));
      opacity: .36;
      transform-origin: center;
    }

    .neon-line.line-a { top: 21%; transform: translateX(-50%) rotate(-4deg); }
    .neon-line.line-b { bottom: 18%; transform: translateX(-50%) rotate(4deg); opacity: .24; }

    .orb {
      border-radius: 999px;
      mix-blend-mode: screen;
      animation: orbFloat 8s ease-in-out infinite;
    }

    .orb.one {
      width: 120px;
      height: 120px;
      left: 4%;
      top: 16%;
      background: rgba(255,45,32,.28);
      filter: blur(42px);
    }

    .orb.two {
      width: 82px;
      height: 82px;
      right: 6%;
      top: 28%;
      background: rgba(255,255,255,.14);
      filter: blur(38px);
      animation-delay: -3s;
    }

    .confetti-layer {
      inset: 0;
      z-index: 5;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size);
      height: var(--size);
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.9) 0%, rgba(255,120,110,.86) 28%, rgba(255,45,32,.82) 68%, rgba(255,45,32,.18) 100%);
      box-shadow: 0 0 8px rgba(255,45,32,.16), 0 0 16px rgba(255,255,255,.04);
      filter: blur(.2px);
      animation: confettiFloat var(--dur) ease-in-out infinite;
    }

    .confetti.line {
      width: calc(var(--size) * .42);
      height: calc(var(--size) * 2.1);
      border-radius: 999px;
      opacity: .38;
      background: linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,110,96,.78) 35%, rgba(255,45,32,.76) 100%);
    }

    .bubble-layer {
      position: fixed;
      inset: 0;
      z-index: 999;
      overflow: visible;
    }

    .poster {
      position: relative;
      z-index: 4;
      width: min(100%, 680px);
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.4svh, 14px);
      padding: 0;
      overflow: visible;
    }

    .title {
      position: relative;
      z-index: 12;
      margin: 0;
      text-align: center;
      pointer-events: none;
      flex: 0 0 auto;
    }

    .title .script {
      display: block;
      color: #fff;
      font-family: var(--font-script);
      font-size: clamp(48px, 11vw, 88px);
      font-weight: 700;
      line-height: .86;
      letter-spacing: -.055em;
      text-shadow:
        0 8px 22px rgba(0,0,0,.52),
        0 0 12px rgba(255,255,255,.20),
        0 0 34px rgba(255,45,32,.34),
        0 0 60px rgba(255,45,32,.16);
    }

    .hero-wrap {
      position: relative;
      z-index: 8;
      width: min(76vw, 360px, calc(58svh * .5625));
      aspect-ratio: 9 / 16;
      flex: 0 0 auto;
      pointer-events: none;
      isolation: isolate;
    }

    .hero-wrap::before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 42px;
      border: 1px solid rgba(255,255,255,.15);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.018) 38%, rgba(255,45,32,.10) 100%);
      box-shadow: 0 0 26px rgba(255,255,255,.06), 0 0 72px rgba(255,45,32,.20), inset 0 1px 0 rgba(255,255,255,.08);
    }

    .hero-wrap::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -22px;
      width: 72%;
      height: 30px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.78) 0%, rgba(255,45,32,.16) 34%, rgba(0,0,0,.24) 64%, transparent 100%);
      filter: blur(12px);
      opacity: .88;
    }

    .film-perf {
      position: absolute;
      top: 18px;
      bottom: 18px;
      width: 16px;
      z-index: 10;
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(18,18,24,.94), rgba(8,8,12,.90));
      box-shadow: 0 0 16px rgba(255,45,32,.12), inset 0 1px 0 rgba(255,255,255,.06);
      pointer-events: none;
    }

    .film-perf.left { left: -23px; border-radius: 16px 0 0 16px; }
    .film-perf.right { right: -23px; border-radius: 0 16px 16px 0; }

    .film-perf::before {
      content: "";
      position: absolute;
      top: 10px;
      bottom: 10px;
      left: 50%;
      width: 7px;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(0,0,0,.98) 0 58%, transparent 62%) center top / 7px 20px repeat-y;
      opacity: .96;
    }

    .screen {
      position: absolute;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      border-radius: 36px;
      background: #000;
      border: 1px solid rgba(255,255,255,.18);
      box-shadow:
        0 32px 92px rgba(0,0,0,.86),
        0 0 28px rgba(255,255,255,.10),
        0 0 96px rgba(255,45,32,.28),
        0 0 150px rgba(255,45,32,.12),
        inset 0 1px 0 rgba(255,255,255,.10);
      animation: screenIn 850ms cubic-bezier(.2,.9,.2,1) both, screenGlowPulse 6s ease-in-out 1s infinite;
      -webkit-mask-image: -webkit-radial-gradient(white, black);
    }

    .avatar-video {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 7px;
      transform: scale(1.035);
      border-radius: inherit;
      clip-path: inset(0 round 36px);
      filter: saturate(1.02) brightness(1.02) contrast(1.16) sepia(.04) hue-rotate(-8deg) drop-shadow(0 0 16px rgba(255,45,32,.16));
    }

    .screen::before,
    .screen::after,
    .scan-light,
    .gloss {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }

    .screen::before {
      z-index: 3;
      background:
        linear-gradient(180deg, rgba(255,255,255,.09), transparent 18%, rgba(255,45,32,.07) 54%, rgba(0,0,0,.54)),
        radial-gradient(circle at 50% 14%, rgba(255,255,255,.12), transparent 18%),
        radial-gradient(circle at 50% 76%, rgba(255,45,32,.14), transparent 30%);
      mix-blend-mode: screen;
    }

    .screen::after {
      z-index: 4;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 0 -80px 120px rgba(0,0,0,.34), inset 0 0 90px rgba(255,45,32,.10);
    }

    .scan-light {
      z-index: 5;
      inset: -6%;
      background: linear-gradient(115deg, transparent 0 32%, rgba(255,255,255,.12) 44%, rgba(255,45,32,.13) 50%, rgba(255,255,255,.05) 56%, transparent 68% 100%);
      mix-blend-mode: screen;
      transform: translateX(-95%) skewX(-14deg);
      opacity: .68;
      animation: scanLightMove 7.2s ease-in-out infinite;
    }

    .gloss {
      z-index: 6;
      background: linear-gradient(115deg, transparent 0 28%, rgba(255,255,255,.13) 42%, transparent 56% 100%);
      transform: translateX(-80%);
      animation: glossMove 5.8s ease-in-out 1.4s infinite;
      opacity: .48;
    }

    .credits {
      position: relative;
      z-index: 10;
      width: min(92vw, 560px);
      text-align: center;
      pointer-events: none;
      flex: 0 0 auto;
    }

    .credits .script {
      display: block;
      margin-bottom: 1px;
      color: #ffbab3;
      font-family: var(--font-script);
      font-size: clamp(19px, 4vw, 30px);
      font-weight: 700;
      line-height: .95;
      letter-spacing: -.03em;
      text-shadow: 0 8px 18px rgba(0,0,0,.44), 0 0 18px rgba(255,45,32,.24);
    }

    .credits .name {
      display: block;
      color: #fff;
      font-family: var(--font-serif);
      font-size: clamp(26px, 4.8vw, 40px);
      font-weight: 900;
      line-height: .9;
      letter-spacing: -.04em;
      text-transform: uppercase;
      text-shadow: 0 12px 28px rgba(0,0,0,.58), 0 0 24px rgba(255,45,32,.20);
    }

    .caption {
      position: relative;
      z-index: 10;
      width: min(390px, 84vw);
      margin: 0;
      color: rgba(255,255,255,.40);
      font-size: 8px;
      font-weight: 750;
      line-height: 1.35;
      letter-spacing: .09em;
      text-align: center;
      text-transform: uppercase;
      pointer-events: none;
      flex: 0 0 auto;
    }

    .bubble {
      position: fixed;
      left: var(--start-x);
      top: var(--start-y);
      z-index: 1000;
      max-width: min(150px, calc(100vw - 44px));
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(10, 10, 14, .78);
      color: rgba(255,255,255,.94);
      box-shadow: 0 18px 42px rgba(0,0,0,.26), 0 0 20px rgba(255,45,32,.18), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -.02em;
      opacity: 0;
      transform: translate3d(-50%, -50%, 0) scale(.74);
      animation: bubbleFloat var(--duration) cubic-bezier(.16,.84,.28,1) forwards;
    }

    .bubble span { position: relative; z-index: 1; }

    @keyframes grain { 0% { transform: translate(0,0); } 25% { transform: translate(-1%,1%); } 50% { transform: translate(1%,-1%); } 75% { transform: translate(-.5%,1.5%); } 100% { transform: translate(0,0); } }
    @keyframes orbFloat { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(8px,-12px,0) scale(1.08); } }
    @keyframes beamFloat { 0%,100% { transform: translateX(-50%) translateY(0) scale(1); } 50% { transform: translateX(-50%) translateY(8px) scale(1.025); } }
    @keyframes beamFlicker { 0%,100% { opacity:.68; } 8% { opacity:.82; } 9% { opacity:.62; } 10% { opacity:.78; } 63% { opacity:.86; filter: blur(26px) brightness(1.08); } 64% { opacity:.68; } }
    @keyframes softFlicker { 0%,100% { opacity:.10; } 9% { opacity:.07; } 10% { opacity:.12; } 57% { opacity:.14; } 58% { opacity:.10; } }
    @keyframes glowShift { 0%,100% { transform: translateX(-50%) translateY(0) scale(1); opacity:.74; } 50% { transform: translateX(-50%) translateY(-12px) scale(1.08); opacity:.9; } }
    @keyframes sweepMoveA { 0%,100% { transform: translateX(0) rotate(-10deg) scaleY(1); opacity:.26; } 50% { transform: translateX(38vw) rotate(-6deg) scaleY(1.06); opacity:.42; } }
    @keyframes sweepMoveB { 0%,100% { transform: translateX(0) rotate(12deg) scaleY(1); opacity:.16; } 50% { transform: translateX(-34vw) rotate(8deg) scaleY(1.04); opacity:.30; } }
    @keyframes flarePulse { 0%,100% { opacity:.22; transform: translateX(-50%) scale(1); } 50% { opacity:.36; transform: translateX(-50%) scale(1.06); } }
    @keyframes screenIn { from { opacity:0; transform: translate3d(0,14px,0) scale(.985); } to { opacity:1; transform: translate3d(0,0,0) scale(1); } }
    @keyframes screenGlowPulse { 0%,100% { box-shadow: 0 32px 92px rgba(0,0,0,.86), 0 0 28px rgba(255,255,255,.10), 0 0 96px rgba(255,45,32,.28), 0 0 150px rgba(255,45,32,.12), inset 0 1px 0 rgba(255,255,255,.10); } 50% { box-shadow: 0 32px 92px rgba(0,0,0,.86), 0 0 34px rgba(255,255,255,.12), 0 0 112px rgba(255,45,32,.36), 0 0 172px rgba(255,45,32,.15), inset 0 1px 0 rgba(255,255,255,.12); } }
    @keyframes glossMove { 0%,100% { transform: translateX(-90%) skewX(-14deg); opacity:0; } 18% { opacity:.44; } 48% { transform: translateX(90%) skewX(-14deg); opacity:.15; } 100% { transform: translateX(90%) skewX(-14deg); opacity:0; } }
    @keyframes scanLightMove { 0%,100% { transform: translateX(-95%) skewX(-14deg); opacity:0; } 16% { opacity:.62; } 48% { transform: translateX(95%) skewX(-14deg); opacity:.16; } 100% { transform: translateX(95%) skewX(-14deg); opacity:0; } }
    @keyframes confettiFloat { 0%,100% { transform: translate3d(0,0,0) rotate(var(--rot)) scale(1); opacity:.34; } 50% { transform: translate3d(var(--drift-x), var(--drift-y), 0) rotate(calc(var(--rot) + 10deg)) scale(1.05); opacity:.64; } }
    @keyframes bubbleFloat { 0% { opacity:0; transform: translate3d(-50%,-50%,0) scale(.72) rotate(0deg); } 18% { opacity:1; transform: translate3d(-50%,-50%,0) translate3d(calc(var(--x) * .82), calc(var(--y) * .82), 0) scale(1) rotate(calc(var(--r) * .7)); } 82% { opacity:1; transform: translate3d(-50%,-50%,0) translate3d(var(--x), var(--y), 0) scale(1) rotate(var(--r)); } 100% { opacity:0; transform: translate3d(-50%,-50%,0) translate3d(calc(var(--x) + var(--drift-x)), calc(var(--y) + var(--drift-y)), 0) scale(.98) rotate(var(--r)); } }

    @media (max-width: 430px) {
      .page {
        padding: max(4px, var(--safe-top)) 8px max(4px, var(--safe-bottom));
      }

      .poster {
        width: 100%;
        gap: 8px;
      }

      .title .script {
        font-size: clamp(42px, 12vw, 58px);
        line-height: .84;
      }

      .hero-wrap {
        width: min(82vw, 330px, calc(54svh * .5625));
      }

      .hero-wrap::before {
        inset: -10px;
        border-radius: 34px;
      }

      .hero-wrap::after {
        width: 68%;
        height: 20px;
        bottom: -16px;
        filter: blur(10px);
      }

      .film-perf {
        width: 10px;
        top: 10px;
        bottom: 10px;
      }

      .film-perf.left { left: -12px; }
      .film-perf.right { right: -12px; }

      .film-perf::before {
        width: 5px;
        background: radial-gradient(circle, rgba(0,0,0,.98) 0 58%, transparent 62%) center top / 5px 16px repeat-y;
      }

      .screen {
        border-radius: 30px;
      }

      .avatar-video {
        object-position: center 7px;
        transform: scale(1.035);
        clip-path: inset(0 round 30px);
      }

      .credits .script {
        font-size: clamp(15px, 4vw, 20px);
      }

      .credits .name {
        font-size: clamp(21px, 5.8vw, 28px);
      }

      .caption {
        width: 80vw;
        font-size: 7px;
        letter-spacing: .05em;
        line-height: 1.15;
      }

      .ambient::before { width: 120vw; height: 50svh; opacity: .56; }
      .ambient::after { width: 420px; height: 420px; bottom: -18%; filter: blur(58px); }
      .lens-flare { width: 88vw; top: 12%; opacity: .24; }
      .neon-line.line-a { top: 20%; opacity: .22; }
      .neon-line.line-b { bottom: 18%; opacity: .16; }
      .orb.one { width: 82px; height: 82px; left: -2%; top: 16%; }
      .orb.two { width: 66px; height: 66px; right: -2%; top: 28%; }
      .light-sweep.one { left: -34%; }
      .light-sweep.two { right: -36%; }
    }

    @media (max-height: 700px) {
      .poster { gap: 6px; }
      .title .script { font-size: clamp(36px, 10vw, 50px); }
      .hero-wrap { width: min(78vw, 300px, calc(50svh * .5625)); }
      .credits .script { font-size: 15px; }
      .credits .name { font-size: 22px; }
      .caption { display: none; }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="ambient" aria-hidden="true">
      <div class="light-flicker"></div>
      <div class="light-sweep one"></div>
      <div class="light-sweep two"></div>
      <div class="lens-flare"></div>
      <div class="neon-line line-a"></div>
      <div class="neon-line line-b"></div>
      <div class="orb one"></div>
      <div class="orb two"></div>
    </div>

    <div class="confetti-layer" id="confettiLayer"></div>
    <div class="bubble-layer" id="bubbleLayer"></div>

    <section class="poster" aria-label="Поздравление">
      <h1 class="title">
        <span class="script">Поздравляю!</span>
      </h1>

      <section class="hero-wrap" aria-label="Аватар">
        <div class="film-perf left"></div>
        <div class="film-perf right"></div>

        <div class="screen">
          <video
            class="avatar-video"
            src="https://raw.githubusercontent.com/endeded95-svg/hbd-ruslantatyanin/main/rt.mp4"
            autoplay
            muted
            loop
            playsinline
          ></video>
          <div class="scan-light"></div>
          <div class="gloss"></div>
        </div>
      </section>

      <div class="credits">
        <span class="script">С днём рождения</span>
        <span class="name">Руслан ✦</span>
      </div>

      <p class="caption">Пусть жизнь будет яркой, красивой и полной крутых моментов.</p>
    </section>
  </main>

  <script>
    const messages = [
      "Руслан! С днём рождения 🍿",
      "Главный герой этого вечера ✨",
      "Только лучшие сцены 🎞️",
      "Больше киношных моментов 🍷",
      "Легендарных приключений 🌍",
      "Красивых кадров 📹",
      "Пусть всё будет как блокбастер 💥",
      "Руслан, сияй! ⚡",
      "С днём рождения ✨",
      "Только лучший вайб 🖤",
      "🎬✨"
    ];

    const characterVideo = document.querySelector(".avatar-video");
    const confettiLayer = document.getElementById("confettiLayer");
    let messageIndex = 0;
    let bubbleTimer = null;
    const order = shuffle(messages.length);

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function shuffle(length) {
      const arr = Array.from({ length }, (_, index) => index);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function seedConfetti() {
      if (!confettiLayer) return;
      confettiLayer.innerHTML = "";
      const types = ["circle", "circle", "circle", "line"];

      for (let i = 0; i < 12; i++) {
        const piece = document.createElement("span");
        const type = types[Math.floor(Math.random() * types.length)];
        piece.className = `confetti ${type}`.trim();

        const sideBias = Math.random();
        const x = sideBias < .48 ? randomBetween(3, 18) : sideBias > .52 ? randomBetween(82, 97) : randomBetween(18, 82);
        const isCenter = x > 28 && x < 72;
        const y = isCenter ? randomBetween(10, 24) : randomBetween(8, 88);
        const size = randomBetween(3, 6);
        const rot = randomBetween(-28, 28);
        const dur = randomBetween(7, 11);

        piece.style.setProperty("--x", `${x}%`);
        piece.style.setProperty("--y", `${y}%`);
        piece.style.setProperty("--size", `${size}px`);
        piece.style.setProperty("--rot", `${rot.toFixed(1)}deg`);
        piece.style.setProperty("--dur", `${dur.toFixed(2)}s`);
        piece.style.setProperty("--drift-x", `${randomBetween(-6, 6).toFixed(1)}px`);
        piece.style.setProperty("--drift-y", `${randomBetween(-10, 10).toFixed(1)}px`);
        piece.style.animationDelay = `${(-Math.random() * dur).toFixed(2)}s`;
        confettiLayer.appendChild(piece);
      }
    }

    function spawnBubble(message) {
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = `<span>${message}</span>`;

      const hero = document.querySelector(".hero-wrap");
      const rect = hero.getBoundingClientRect();
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const marginX = screenWidth < 430 ? 70 : 96;
      const minX = marginX;
      const maxX = screenWidth - marginX;
      const minY = Math.max(50, Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--safe-top")) || 0);
      const maxY = screenHeight - (screenWidth < 430 ? 96 : 98);

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function safeRandomX(min, max) {
        const left = clamp(min, minX, maxX);
        const right = clamp(max, minX, maxX);
        if (right <= left) return clamp((min + max) / 2, minX, maxX);
        return randomBetween(left, right);
      }

      function safeRandomY(min, max) {
        const top = clamp(min, minY, maxY);
        const bottom = clamp(max, minY, maxY);
        if (bottom <= top) return clamp((min + max) / 2, minY, maxY);
        return randomBetween(top, bottom);
      }

      const zones = [
        {
          startX: clamp(centerX, minX, maxX),
          startY: clamp(rect.top + rect.height * .18, minY, maxY),
          targetX: safeRandomX(65, screenWidth - 65),
          targetY: safeRandomY(minY, rect.top - 18)
        },
        {
          startX: clamp(rect.left + 12, minX, maxX),
          startY: clamp(centerY, minY, maxY),
          targetX: safeRandomX(65, rect.left - 24),
          targetY: safeRandomY(100, screenHeight - 120)
        },
        {
          startX: clamp(rect.right - 12, minX, maxX),
          startY: clamp(centerY, minY, maxY),
          targetX: safeRandomX(rect.right + 24, screenWidth - 65),
          targetY: safeRandomY(100, screenHeight - 120)
        }
      ];

      const zone = zones[Math.floor(Math.random() * zones.length)];
      bubble.style.setProperty("--start-x", `${zone.startX}px`);
      bubble.style.setProperty("--start-y", `${zone.startY}px`);
      bubble.style.setProperty("--x", `${zone.targetX - zone.startX}px`);
      bubble.style.setProperty("--y", `${zone.targetY - zone.startY}px`);
      bubble.style.setProperty("--drift-x", `${randomBetween(-5, 5).toFixed(1)}px`);
      bubble.style.setProperty("--drift-y", `${randomBetween(-5, 5).toFixed(1)}px`);
      bubble.style.setProperty("--r", `${randomBetween(-5, 5).toFixed(2)}deg`);
      bubble.style.setProperty("--duration", `${randomBetween(7.2, 8.8).toFixed(2)}s`);

      document.body.appendChild(bubble);
      bubble.addEventListener("animationend", () => bubble.remove(), { once: true });
    }

    function tick() {
      if (messageIndex >= messages.length) {
        if (bubbleTimer) {
          window.clearInterval(bubbleTimer);
          bubbleTimer = null;
        }
        return;
      }

      spawnBubble(messages[order[messageIndex]]);
      messageIndex += 1;
    }

    function startMessages() {
      tick();
      bubbleTimer = window.setInterval(tick, 760);
    }

    function init() {
      if (characterVideo) {
        characterVideo.muted = true;
        characterVideo.play().catch(() => {});
      }

      seedConfetti();
      window.setTimeout(startMessages, 550);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
